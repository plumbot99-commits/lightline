<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Lightline's mark, in the skin's hand: a short beam of light on the dark ground and its lit playhead. -->
  <defs>
    <linearGradient id="trail" x1="5" x2="20" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ee8e9" stop-opacity="0"/>
      <stop offset="1" stop-color="#6ee8e9"/>
    </linearGradient>
    <radialGradient id="head">
      <stop offset="0.3" stop-color="#fff"/>
      <stop offset="0.72" stop-color="#6ee8e9"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6ee8e9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6ee8e9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#060a0e"/>
  <path d="M20 16h7" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M5 16h15" stroke="url(#trail)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="20" cy="16" r="7" fill="url(#glow)"/>
  <circle cx="20" cy="16" r="3.4" fill="url(#head)"/>
</svg>
